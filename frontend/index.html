<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task Manager</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 0 20px; }
    h1 { color: #333; }
    input { padding: 8px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .del { background: #dc3545; }
  </style>
</head>
<body>
  <h1>📝 Task Manager</h1>
  <input type="text" id="taskInput" placeholder="Enter a task..." />
  <button onclick="addTask()">Add Task</button>
  <ul id="taskList"></ul>

  <script>
    const API = 'http://localhost:5000';

    async function loadTasks() {
      const res = await fetch(`${API}/tasks`);
      const tasks = await res.json();
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach(task => {
        list.innerHTML += `
          <li>
            ${task.title}
            <button class="del" onclick="deleteTask('${task._id}')">Delete</button>
          </li>`;
      });
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      await fetch(`${API}/tasks`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API}/tasks/${id}`, { method: 'DELETE' });
      loadTasks();
    }

    loadTasks();
  </script>
</body>
</html>
